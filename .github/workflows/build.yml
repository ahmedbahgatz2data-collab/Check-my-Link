name: Build Windows EXE (URL Checker Pro - Lite)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller (System Edge/Chrome)
        shell: pwsh
        run: |
          $CTK_PATH = python -c "import os, customtkinter; print(os.path.dirname(customtkinter.__file__))"
          $PW_PATH = python -c "import os, playwright; print(os.path.dirname(playwright.__file__))"
          pyinstaller --noconfirm --onefile --windowed `
            --name "URL_Checker_Pro" `
            --add-data "$CTK_PATH;customtkinter/" `
            --add-data "$PW_PATH/driver;playwright/driver" `
            --exclude-module tkinter.test `
            --exclude-module unittest `
            --exclude-module pydoc `
            --hidden-import "openpyxl" `
            --hidden-import "bs4" `
            --hidden-import "playwright.sync_api" `
            URL_Checker_Pro.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: URL_Checker_Pro_Windows_x64
          path: dist/URL_Checker_Pro.exe

      - name: Prepare Release Metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $title = "URL Checker Pro $tag"
          } else {
            $tag = "build-${{ github.run_number }}"
            $title = "Auto Build #${{ github.run_number }}"
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$title" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          release_name: ${{ steps.meta.outputs.release_name }}
          files: dist/URL_Checker_Pro.exe
          generate_release_notes: true
